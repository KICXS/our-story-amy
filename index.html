<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#18152f">
  <meta name="description" content="Our Story — a chapter-based anniversary journey for Amy.">
  <title>Our Story · Amy</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap");
    :root {
      --favorite: #f7a8c4;
      --accent: #ffcf70;
      --ink: #fff8f4;
      --muted: #d7cbe4;
      --night: #14112d;
      --night-2: #291a43;
      --paper: #fff5e8;
      --paper-ink: #3a2841;
      --glass: rgba(255,255,255,.11);
      --line: rgba(255,255,255,.2);
      --shadow: 0 1.5rem 4rem rgba(9, 5, 28, .34);
      --ease: cubic-bezier(.16, 1, .3, 1);
    }
    * { box-sizing: border-box; }
    html { min-width: 280px; background: var(--night); }
    body {
      margin: 0; min-height: 100dvh; color: var(--ink);
      font: 500 1rem/1.5 "DM Sans", system-ui, sans-serif;
      background: radial-gradient(circle at 50% 0%, #59407a 0, var(--night) 46%, #0c0a1d 100%);
    }
    button, input { font: inherit; }
    button { color: inherit; cursor: pointer; touch-action: manipulation; }
    .app-shell { min-height: 100dvh; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); display: grid; place-items: center; }
    .app {
      width: min(100%, 30rem); min-height: 100dvh; overflow: hidden; position: relative;
      background: linear-gradient(160deg, rgba(80, 57, 110, .58), rgba(15, 13, 37, .98));
      box-shadow: var(--shadow);
    }
    @media (min-width: 38rem) {
      body { padding: 2rem; }
      .app { min-height: min(54rem, calc(100dvh - 4rem)); border-radius: 2rem; }
    }
    .screen { min-height: 100dvh; padding: clamp(1.2rem, 5vw, 2rem); position: relative; display: flex; flex-direction: column; isolation: isolate; }
    @media (min-width: 38rem) { .screen { min-height: min(54rem, calc(100dvh - 4rem)); } }
    .screen::before {
      content: ""; position: absolute; inset: 0; z-index: -2; pointer-events: none;
      background: radial-gradient(circle at 15% 15%, rgba(255,255,255,.13), transparent 34%), radial-gradient(circle at 90% 80%, rgba(255,176,213,.12), transparent 30%);
    }
    .screen::after {
      content: ""; position: absolute; inset: 0; z-index: -1; opacity: .13; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }
    .screen.paper { color: var(--paper-ink); background: linear-gradient(145deg, #fff8ef, #f8dcc2); }
    .screen.paper::before { background: radial-gradient(circle at 85% 12%, rgba(255,188,115,.35), transparent 30%), radial-gradient(circle at 10% 80%, rgba(255,255,255,.8), transparent 36%); }
    .screen.night { background: radial-gradient(circle at 52% 12%, #40346d, #17132f 55%, #080817 100%); }
    .screen.rose { background: radial-gradient(circle at 50% 0%, #704062, #261832 64%, #120d20 100%); }
    .hidden { display: none !important; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: .75rem; min-height: 2.75rem; position: relative; z-index: 3; }
    .eyebrow { color: var(--accent); text-transform: uppercase; letter-spacing: .14em; font-size: .72rem; font-weight: 700; }
    h1, h2, h3 { margin: 0; font-family: "Playfair Display", Georgia, serif; line-height: 1.08; }
    h1 { font-size: clamp(2.4rem, 12vw, 4.3rem); }
    h2 { font-size: clamp(2rem, 9vw, 3rem); }
    h3 { font-size: 1.35rem; }
    p { margin: 0; }
    .script { font-family: "Caveat", cursive; font-weight: 600; }
    .muted { color: var(--muted); }
    .paper .muted { color: #806b78; }
    .center { text-align: center; align-items: center; }
    .center > * { width: 100%; }
    .spacer { flex: 1; }
    .btn {
      min-height: 2.9rem; border: 0; border-radius: 999px; padding: .7rem 1.25rem;
      display: inline-flex; align-items: center; justify-content: center; gap: .55rem;
      color: #29152a; background: linear-gradient(135deg, var(--accent), #ffe8ac);
      font-weight: 700; box-shadow: 0 .45rem 1.2rem rgba(255, 207, 112, .22);
      transition: transform .25s var(--ease), filter .25s var(--ease);
    }
    .btn:hover, .btn:focus-visible { transform: translateY(-2px); filter: brightness(1.06); outline: none; }
    .btn.ghost { color: var(--ink); background: var(--glass); border: 1px solid var(--line); box-shadow: none; }
    .btn.small { min-height: 2.35rem; padding: .45rem .8rem; font-size: .88rem; }
    .icon-btn { width: 2.7rem; height: 2.7rem; border: 1px solid var(--line); border-radius: 50%; background: var(--glass); display: grid; place-items: center; }
    .lock-stage { display: grid; place-items: center; min-height: 28vh; }
    .gift { width: clamp(7rem, 33vw, 10rem); aspect-ratio: 1; position: relative; display: grid; place-items: center; transition: transform .45s var(--ease), filter .45s; }
    .gift::before, .gift::after { content: ""; position: absolute; border-radius: .55rem; background: linear-gradient(135deg, var(--favorite), #9b5b96); box-shadow: 0 0 2.6rem rgba(255, 169, 210, .55); }
    .gift::before { width: 86%; height: 64%; bottom: 8%; }
    .gift::after { width: 94%; height: 18%; bottom: 57%; background: linear-gradient(135deg, #ffc4db, #b16da1); }
    .gift-ribbon { position: absolute; width: 18%; height: 84%; background: var(--accent); z-index: 2; border-radius: .25rem; bottom: 8%; }
    .gift-bow { position: absolute; z-index: 3; top: 20%; width: 4rem; height: 2rem; }
    .gift-bow::before, .gift-bow::after { content:""; position:absolute; width: 2.15rem; height: 1.4rem; background: var(--accent); border-radius: 80% 20% 80% 20%; }
    .gift-bow::before { transform: rotate(28deg); left:0; } .gift-bow::after { transform: rotate(-28deg); right:0; }
    .gift.shake { animation: shake .55s; }
    .date-line { font-size: .88rem; color: var(--muted); }
    .sweet-line { min-height: 3.2rem; color: #ffe4ae; font: 600 1.35rem "Caveat", cursive; }
    .sparkles, .particles { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: -1; }
    .sparkle { position: absolute; color: var(--accent); animation: float 6s ease-in-out infinite; opacity: .7; }
    .toast { position: fixed; left: 50%; bottom: calc(1.4rem + env(safe-area-inset-bottom)); z-index: 20; transform: translate(-50%, 1rem); width: min(88vw, 26rem); padding: .8rem 1rem; text-align: center; border-radius: 1rem; background: #261b3c; border: 1px solid var(--line); box-shadow: var(--shadow); opacity: 0; transition: .3s var(--ease); pointer-events: none; }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }
    .progress { height: .3rem; background: rgba(255,255,255,.14); border-radius: 999px; overflow: hidden; margin: .25rem 0 1.25rem; }
    .progress i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--favorite), var(--accent)); transition: width .6s var(--ease); }
    .door { width: min(74vw, 15rem); aspect-ratio: .62; margin: 1rem auto 1.5rem; border-radius: 45% 45% .8rem .8rem; border: .4rem solid #b47599; background: linear-gradient(135deg, #51315d, #1d1838); box-shadow: 0 0 2rem rgba(255, 183, 219, .28), inset 0 0 2rem rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; position: relative; }
    .door::after { content:""; width: .9rem; height: .9rem; border-radius: 50%; background: var(--accent); position: absolute; right: 16%; top: 52%; box-shadow: 0 0 .8rem var(--accent); }
    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: .45rem; width: min(100%, 19rem); margin: 0 auto; }
    .key { min-height: 2.9rem; border: 1px solid var(--line); border-radius: .7rem; background: var(--glass); font-weight: 700; }
    .code-display { height: 2.6rem; letter-spacing: .4em; font-size: 1.3rem; text-align: center; color: var(--accent); }
    .scene { border-radius: 1.4rem; border: 1px solid var(--line); background: rgba(255,255,255,.08); padding: 1rem; position: relative; overflow: hidden; }
    .scene-art { min-height: 12rem; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, rgba(255,216,157,.37), transparent 28%), linear-gradient(145deg, rgba(255,177,200,.22), rgba(79,50,104,.5)); }
    .place-sign { padding: .75rem 1.15rem; border: .2rem solid #f4c18b; color: #ffe1a7; transform: rotate(-3deg); font: 700 1.4rem "Caveat", cursive; box-shadow: 0 0 .8rem rgba(255,196,125,.3); }
    .objects { display: grid; grid-template-columns: repeat(5, 1fr); gap: .45rem; margin-top: .8rem; }
    .object { min-height: 3.4rem; border: 1px solid var(--line); border-radius: .8rem; background: rgba(255,255,255,.09); font-size: 1.35rem; }
    .memory-card { margin-top: .85rem; padding: .9rem; background: rgba(255,255,255,.11); border-left: .2rem solid var(--accent); border-radius: .8rem; animation: rise .35s var(--ease); }
    .puzzle { margin-top: 1rem; display: grid; grid-template-columns: repeat(3, 1fr); gap: .45rem; }
    .puzzle-piece { min-height: 3.8rem; border: 1px dashed rgba(255,255,255,.5); border-radius: .7rem; background: linear-gradient(135deg, rgba(255,169,200,.36), rgba(255,207,112,.2)); display:grid; place-items:center; font-weight:700; user-select:none; touch-action:none; }
    .puzzle-piece.selected { border-color: var(--accent); box-shadow: 0 0 1rem rgba(255,207,112,.42); transform: scale(1.04); }
    .jar { width: 5.2rem; height: 6rem; border: .2rem solid rgba(255,255,255,.65); border-radius: 0 0 1.5rem 1.5rem; margin: 1rem auto; position:relative; display:flex; flex-wrap:wrap; align-content:flex-end; justify-content:center; padding:.45rem; gap:.1rem; background: linear-gradient(to top, rgba(255,120,190,.35), rgba(255,255,255,.04)); }
    .jar::before { content:""; position:absolute; top:-.45rem; left:.6rem; right:.6rem; height:.5rem; border: .2rem solid rgba(255,255,255,.65); border-radius:.4rem; }
    .heart { color: #ff9fca; text-shadow: 0 0 .5rem currentColor; animation: pop .5s var(--ease); }
    .quiz-options { display:grid; gap:.55rem; margin-top: 1rem; }
    .option { min-height: 2.9rem; border: 1px solid var(--line); border-radius: .9rem; padding: .7rem .85rem; text-align:left; background: rgba(255,255,255,.09); }
    .option:hover, .option:focus-visible { border-color: var(--accent); background: rgba(255,207,112,.14); outline:none; }
    .sky { position: relative; min-height: 22rem; flex:1; margin: .5rem -.4rem 0; }
    .star { position:absolute; width: 1.3rem; height: 1.3rem; border:0; border-radius:50%; background:var(--accent); box-shadow:0 0 1rem var(--accent); display:grid; place-items:center; color:transparent; touch-action:none; }
    .star.visited { background: #ff9fca; box-shadow:0 0 1rem #ff9fca; }
    .star.active { transform: scale(1.35); }
    .constellation { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
    .moon { position:absolute; top:8%; right:8%; width:4.7rem; aspect-ratio:1; border-radius:50%; background:#fff1be; box-shadow:0 0 2.4rem rgba(255,238,172,.75); border:0; color:#57465a; font-size:1.6rem; }
    .catch-game { height: 11rem; margin-top: .8rem; border:1px solid var(--line); border-radius:1rem; position:relative; overflow:hidden; background:linear-gradient(#171333, #35214d); touch-action:none; }
    .falling-star { position:absolute; font-size:1.3rem; animation: fall 2.8s linear forwards; pointer-events:auto; }
    .letter { flex:1; display:flex; flex-direction:column; justify-content:center; }
    .envelope { width:min(80vw, 18rem); aspect-ratio:1.35; margin:1.5rem auto; background:#dda37d; position:relative; border-radius:.7rem; box-shadow:0 .8rem 2rem rgba(107,46,54,.22); display:grid; place-items:center; cursor:pointer; }
    .envelope::before { content:""; position:absolute; inset:0; background:#edbd95; clip-path:polygon(0 0, 100% 0, 50% 58%); border-radius:.7rem .7rem 0 0; transition: transform .6s var(--ease); transform-origin:top; }
    .envelope.open::before { transform:rotateX(180deg); }
    .seal { width:3.2rem; height:3.2rem; border-radius:50%; background:#9e3f59; border:.2rem solid #e3a06f; display:grid; place-items:center; color:#ffd3b4; z-index:2; }
    .letter-text { min-height: 13rem; padding:1rem; color:#4e3641; font:600 1.4rem/1.35 "Caveat", cursive; white-space:pre-line; }
    .riddle-card { margin: 2rem 0; padding:1.3rem; border-radius:1.2rem; background:rgba(255,255,255,.1); border:1px solid var(--line); text-align:center; font:600 1.65rem/1.25 "Caveat", cursive; }
    .answer-form { display:flex; gap:.55rem; }
    .answer-form input { flex:1; min-width:0; min-height:2.9rem; padding:.7rem 1rem; border-radius:999px; border:1px solid var(--line); background:rgba(255,255,255,.1); color:var(--ink); }
    .answer-form input:focus { outline:2px solid var(--accent); outline-offset:2px; }
    .finale { text-align:center; justify-content:center; overflow:hidden; background:radial-gradient(circle at 50% 25%, #704c85, #1b1534 62%, #090817); }
    .finale h1 { color:#ffe4a8; text-shadow:0 0 1.2rem rgba(255,211,134,.55); }
    .yes-no { display:flex; justify-content:center; gap:1rem; margin-top:2rem; position:relative; min-height:3rem; }
    .no-btn { transition: transform .2s var(--ease); }
    .photo-placeholder { width:min(55vw, 12rem); aspect-ratio:1; margin:1.5rem auto; border-radius:50%; border:.3rem solid var(--accent); background:radial-gradient(circle at 30% 25%, #ffe1ef, #a86693 45%, #34204d); display:grid; place-items:center; color:#fff; font:600 3rem "Caveat", cursive; box-shadow:0 0 2rem rgba(255,205,121,.38); cursor:pointer; user-select:none; }
    .confetti-piece { position:absolute; top:-1rem; width:.45rem; height:.8rem; background:var(--accent); animation:confetti 2.8s linear forwards; }
    @keyframes float { 50% { transform:translateY(-1.3rem) rotate(12deg); opacity:1; } }
    @keyframes shake { 20%,60% { transform:translateX(-.6rem) rotate(-4deg); } 40%,80% { transform:translateX(.6rem) rotate(4deg); } }
    @keyframes rise { from { opacity:0; transform:translateY(.7rem); } }
    @keyframes pop { 0% { transform:scale(.3); } 80% { transform:scale(1.25); } }
    @keyframes fall { from { transform:translateY(-2rem) rotate(0); } to { transform:translateY(13rem) rotate(180deg); } }
    @keyframes confetti { to { transform:translateY(110vh) rotate(540deg); opacity:0; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration:.01ms !important; transition-duration:.01ms !important; } }
  </style>
</head>
<body>
  <main class="app-shell"><div id="app" class="app"></div></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
    /* EDIT THIS BLOCK: replace bracketed details, photo paths, and audio paths before sending. */
    const STORY = {
      herName: "Amy",
      anniversary: "11 December 2026",
      bsDate: "Mangsir 25, 2083 B.S.",
      unlockCode: "1112",
      metDate: "[date we met]",
      togetherDate: "[date we got together]",
      favoriteColor: "[color]",
      accentColor: "[color]",
      favoriteSong: "[song]",
      metPlace: "[place]",
      memories: [
        ["🌸", "[object 1 → memory 1]"], ["🎟️", "[object 2 → memory 2]"], ["☕", "[object 3 → memory 3]"],
        ["📷", "[object 4 → memory 4]"], ["🧸", "[object 5 → memory 5]"]
      ],
      puzzlePhoto: "", // Example: "assets/our-photo.jpg"
      puzzleSweetLine: "[sweet line]",
      quiz: [
        ["[Q1]", ["[correct answer]", "[wrong answer]", "[wrong answer]", "[wrong answer]"], 0],
        ["[Q2]", ["[correct answer]", "[wrong answer]", "[wrong answer]", "[wrong answer]"], 0],
        ["[Q3]", ["[correct answer]", "[wrong answer]", "[wrong answer]", "[wrong answer]"], 0],
        ["[Q4]", ["[correct answer]", "[wrong answer]", "[wrong answer]", "[wrong answer]"], 0],
        ["[Q5]", ["[correct answer]", "[wrong answer]", "[wrong answer]", "[wrong answer]"], 0],
        ["[Q6]", ["[correct answer]", "[wrong answer]", "[wrong answer]", "[wrong answer]"], 0]
      ],
      bonusMemory: "[bonus memory]",
      starMessages: ["[msg 1]", "[msg 2]", "[msg 3]", "[msg 4]", "[msg 5]"],
      moonJoke: "[joke for moon easter egg]",
      finalPhotoSecret: "[secret message for final photo]",
      letter: "[letter sentence 1]\n[letter sentence 2]\n[letter sentence 3]\n[letter sentence 4]\n[letter sentence 5]\n[letter sentence 6]\n[letter sentence 7]",
      riddle: "[riddle]",
      riddleAnswer: "[answer]",
      finaleText: "Happy 1st Anniversary, Amy. Will you spend every anniversary with me?",
      sweetLines: ["Somewhere between then and now, you became my favorite place.", "A little patience for a very big love story.", "Every second is one second closer to you."],
      funnyHint: "[funny hint]",
      wrongQuiz: "That one was a tiny plot twist. Try again, my love.",
      photoAlt: "A future photo of Amy and me"
    };
    document.documentElement.style.setProperty("--favorite", STORY.favoriteColor.startsWith("[") ? "#f7a8c4" : STORY.favoriteColor);
    document.documentElement.style.setProperty("--accent", STORY.accentColor.startsWith("[") ? "#ffcf70" : STORY.accentColor);
    const $ = (s, root=document) => root.querySelector(s);
    const app = $("#app"), toast = $("#toast");
    const params = new URLSearchParams(location.search);
    let screen = "welcome";
    let chapter = 0, soundOn = true, audio, code = "", memory = null, selectedPiece = null, quizIndex = 0, hearts = 0;
    let visitedStars = [], starGameCount = 0, typingTimer, letterShown = false, photoTaps = 0;
    const showToast = (message) => { toast.textContent = message; toast.classList.add("show"); clearTimeout(showToast.t); showToast.t = setTimeout(()=>toast.classList.remove("show"), 2800); };
    const escape = (text) => String(text).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function particles(count=12) {
      return `<div class="particles">${Array.from({length:count}, (_,i)=>`<span class="sparkle" style="left:${5+Math.random()*90}%;top:${4+Math.random()*90}%;animation-delay:${i/3}s">✦</span>`).join("")}</div>`;
    }
    function audioStart() {
      if (!soundOn) return;
      audio ||= new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === "suspended") audio.resume();
      const osc = audio.createOscillator(), gain = audio.createGain();
      osc.frequency.value = 392; gain.gain.setValueAtTime(.0001, audio.currentTime); gain.gain.exponentialRampToValueAtTime(.06, audio.currentTime+.02); gain.gain.exponentialRampToValueAtTime(.0001, audio.currentTime+.65);
      osc.connect(gain).connect(audio.destination); osc.start(); osc.stop(audio.currentTime+.7);
    }
    function toggleSound() { soundOn = !soundOn; if (soundOn) audioStart(); render(); }
    function topbar(label, back=true) {
      return `<div class="topbar"><button class="btn ghost small ${back?'':'hidden'}" data-action="back">← Back</button><span class="eyebrow">${escape(label)}</span><button class="icon-btn" data-action="sound" aria-label="Toggle sound">${soundOn?"🔊":"🔇"}</button></div>`;
    }
    function render() {
      if (screen === "welcome") return renderWelcome();
      if (screen === "door") return renderDoor();
      if (screen === "chapter") return renderChapter();
      if (screen === "finale") return renderFinale();
      if (screen === "after") return renderAfter();
    }
    function renderWelcome() {
      app.innerHTML = `${particles()}<section class="screen center"><div class="spacer"></div><div class="eyebrow">Unlocked · ${escape(STORY.anniversary)}</div><h1>The wait is over.</h1><p class="muted">A little journey through us is ready.</p><div class="lock-stage"><div class="gift" style="filter:brightness(1.3)"><i class="gift-ribbon"></i><i class="gift-bow"></i></div></div><button class="btn" data-action="open">Open your surprise ✨</button><p class="date-line" style="margin-top:1rem">${escape(STORY.anniversary)} | ${escape(STORY.bsDate)}</p><div class="spacer"></div></section>`;
    }
    function renderDoor() {
      app.innerHTML = `${particles(8)}<section class="screen center">${topbar("The first little secret", false)}<div class="spacer"></div><div class="eyebrow">Chapter 1 begins at the door</div><h2>One secret code.</h2><p class="muted">Use the date we met or our special nickname.</p><div class="door"></div><input class="code-display" id="codeDisplay" readonly aria-label="Code" value="${escape(code.replace(/./g,"•"))}"><div class="keypad">${["1","2","3","4","5","6","7","8","9","←","0","✓"].map(k=>`<button class="key" data-key="${k}">${k}</button>`).join("")}</div><p class="muted" style="font-size:.85rem;margin-top:.7rem">Hint: ${escape(STORY.metDate)}</p><div class="spacer"></div></section>`;
    }
    function renderChapter() {
      const chapters = [renderChapter1, renderChapter2, renderChapter3, renderChapter4, renderChapter5];
      app.innerHTML = chapters[chapter]();
      const bar = $(".progress"); if (bar) $(".progress i").style.width = `${((chapter+1)/5)*100}%`;
      if (chapter === 3 && letterShown) startTyping();
      if (chapter === 2) setupStars();
    }
    function chapterFrame(title, sub, content, cls="") {
      return `<section class="screen ${cls}">${topbar(`Chapter ${chapter+1} of 5`)}<div class="progress"><i style="width:0"></i></div><div class="eyebrow">${escape(sub)}</div><h2>${escape(title)}</h2>${content}<div class="spacer"></div><div style="display:flex;justify-content:space-between;gap:.6rem;margin-top:1rem"><button class="btn ghost small" data-action="skip">Skip animation</button><button class="btn small" data-action="next">${chapter===4?"Open the final door":"Continue →"}</button></div></section>`;
    }
    function renderChapter1() {
      const card = memory ? `<div class="memory-card"><strong>${escape(memory[0])}</strong><p>${escape(memory[1])}</p></div>` : `<p class="muted" style="margin-top:.7rem">Tap each little object to uncover what it remembers.</p>`;
      const pieces = [1,2,3,4,5,6].map(n=>`<button class="puzzle-piece ${selectedPiece===n?'selected':''}" data-piece="${n}">${selectedPiece===n?"Placed":"Piece "+n}</button>`).join("");
      return chapterFrame("How it began", `Where our story first found us: ${STORY.metPlace}`, `<div class="scene" style="margin-top:1rem"><div class="scene-art"><div class="place-sign">${escape(STORY.metPlace)}</div></div><div class="objects">${STORY.memories.map((m,i)=>`<button class="object" data-memory="${i}" aria-label="Memory ${i+1}">${m[0]}</button>`).join("")}</div>${card}</div><p class="muted" style="margin-top:1rem">Now assemble six tiny pieces of our photo.</p><div class="puzzle">${pieces}</div><p class="muted" style="font-size:.85rem;margin-top:.6rem">${selectedPiece===6?"All pieces are glowing — tap Continue.":"Tap pieces in order, like putting a memory back together."}</p>`);
    }
    function renderChapter2() {
      const q = STORY.quiz[quizIndex] || STORY.quiz[0];
      const content = quizIndex >= STORY.quiz.length ? `<div class="jar">${Array.from({length:hearts},()=>`<span class="heart">♥</span>`).join("")}</div><div class="memory-card"><strong>Bonus memory unlocked</strong><p>${escape(STORY.bonusMemory)}</p></div>` : `<div class="jar">${Array.from({length:hearts},()=>`<span class="heart">♥</span>`).join("")}</div><p class="muted">Question ${quizIndex+1} of ${STORY.quiz.length}</p><h3 style="margin-top:.7rem">${escape(q[0])}</h3><div class="quiz-options">${q[1].map((o,i)=>`<button class="option" data-answer="${i}">${escape(o)}</button>`).join("")}</div>`;
      return chapterFrame("Things only we know", "Six little truths about us", content);
    }
    const starPositions = [[18,28],[38,16],[57,31],[75,22],[84,52],[61,64],[33,72]];
    function renderChapter3() {
      const stars = starPositions.map((p,i)=>`<button class="star ${visitedStars.includes(i)?'visited':''}" style="left:${p[0]}%;top:${p[1]}%" data-star="${i}" aria-label="Star ${i+1}">${visitedStars.includes(i)?"♥":"✦"}</button>`).join("");
      return chapterFrame("The constellation walk", "Our night sky", `<div class="sky"><svg class="constellation" viewBox="0 0 100 100" preserveAspectRatio="none">${visitedStars.slice(1).map((s,i)=>{const a=starPositions[visitedStars[i]],b=starPositions[s];return `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#ffcf70" stroke-width=".35"/>`;}).join("")}</svg>${stars}<button class="moon" data-action="moon" aria-label="Moon">☾</button></div><div class="catch-game" id="catchGame" aria-label="Catch seven falling stars"><p style="padding:.7rem;text-align:center;color:#d7cbe4">Catch 7 falling stars · ${starGameCount}/7</p></div><p class="muted" style="font-size:.85rem">${visitedStars.length===5?"Our night sky, 11 December 2026":"Connect each star to read a message."}</p>`, "night");
    }
    function renderChapter4() {
      const body = letterShown ? `<div class="letter-text" id="letterText"></div>` : `<div class="envelope" data-action="letter"><div class="seal">♥</div></div><p class="muted" style="text-align:center">Tap the seal when you're ready.</p>`;
      return chapterFrame("The letter", "A quiet place for my favorite words", `<div class="letter">${body}</div><p class="muted" style="font-size:.85rem;text-align:center">${escape(STORY.favoriteSong)} · sound is optional</p>`, "paper");
    }
    function renderChapter5() {
      return chapterFrame("The final riddle", "One last little door", `<div class="riddle-card">${escape(STORY.riddle)}</div><form class="answer-form" id="riddleForm"><input id="riddleInput" autocomplete="off" placeholder="Your answer…" aria-label="Riddle answer"><button class="btn" type="submit">Unlock</button></form><p class="muted" style="text-align:center;margin-top:.8rem">A correct answer opens the last chapter.</p>`);
    }
    function renderFinale() {
      app.innerHTML = `${particles(18)}<section class="screen finale"><div class="eyebrow">The final door is open</div><h1 style="margin-top:1rem">${escape(STORY.finaleText)}</h1><p class="muted" style="margin-top:1rem">There is only one answer I am hoping for.</p><div class="yes-no"><button class="btn" data-action="yes">YES, always 💛</button><button class="btn ghost no-btn" data-action="no">No</button></div><div class="spacer"></div><p class="date-line">${escape(STORY.anniversary)} | ${escape(STORY.bsDate)}</p></section>`;
    }
    function renderAfter() {
      const days = STORY.togetherDate.startsWith("[") ? "∞" : Math.max(0, Math.floor((Date.now()-Date.parse(STORY.togetherDate))/86400000));
      app.innerHTML = `${particles(20)}<section class="screen finale"><div class="eyebrow">Our story continues</div><div class="photo-placeholder" data-action="photo" aria-label="${escape(STORY.photoAlt)}">A<span>♥</span></div><h2>1 year together.</h2><p class="date-line">${escape(STORY.anniversary)} | ${escape(STORY.bsDate)}</p><p class="script" style="font-size:2rem;color:#ffe4a8;margin-top:1rem">Days together: ${days}</p><p class="muted" style="margin-top:1.2rem">To be continued...</p></section>`;
    }
    function confetti() {
      document.querySelectorAll(".confetti-piece").forEach(e=>e.remove());
      for (let i=0;i<42;i++) { const e=document.createElement("i"); e.className="confetti-piece"; e.style.left=Math.random()*100+"%"; e.style.background=["#ff9fca","#ffcf70","#b9a4ff","#ffffff"][i%4]; e.style.animationDelay=Math.random()*1.2+"s"; document.querySelector(".app").append(e); }
    }
    function setupStars() {
      const game = $("#catchGame"); if (!game) return;
      clearInterval(setupStars.timer);
      setupStars.timer = setInterval(()=>{ if (starGameCount>=7 || !$("#catchGame")) return; const star=document.createElement("button"); star.className="falling-star"; star.textContent="✦"; star.style.left=(5+Math.random()*85)+"%"; star.setAttribute("aria-label","Falling star"); star.onclick=()=>{ star.remove(); starGameCount++; renderChapter(); }; game.append(star); }, 1000);
    }
    function startTyping() {
      if (!letterShown) return;
      clearInterval(typingTimer); const el=$("#letterText"); if (!el || el.dataset.done) return;
      const text=STORY.letter, chars=[...text]; let i=0; el.textContent=""; typingTimer=setInterval(()=>{ el.textContent+=chars[i++]||""; if(i>=chars.length){clearInterval(typingTimer);el.dataset.done="1";} }, 28);
      el.onclick=()=>{ el.textContent=text; clearInterval(typingTimer); el.dataset.done="1"; };
    }
    app.addEventListener("click", e => {
      const targetEl=e.target.closest("[data-action],[data-key],[data-memory],[data-piece],[data-answer],[data-star]"); if (!targetEl) return;
      audioStart();
      const action=targetEl.dataset.action;
      if (action==="sound") return toggleSound();
      if (action==="shake") { targetEl.classList.remove("shake"); void targetEl.offsetWidth; targetEl.classList.add("shake"); showToast("Not yet, Amy… patience is also a form of love."); return; }
      if (action==="open") { screen="door"; render(); return; }
      if (action==="back") { if (screen==="chapter" && chapter>0) chapter--; else if(screen==="door") screen="welcome"; render(); return; }
      if (action==="skip") { if (screen==="chapter" && chapter===3 && letterShown) { const el=$("#letterText"); if(el){el.textContent=STORY.letter;el.dataset.done="1";clearInterval(typingTimer);} } return; }
      if (action==="next") { if (chapter===0 && selectedPiece!==6) return showToast("A few photo pieces are still waiting for us."); if (chapter<4) { chapter++; render(); } else { screen="finale"; render(); confetti(); } return; }
      if (action==="yes") { screen="after"; render(); confetti(); return; }
      if (action==="no") { targetEl.style.transform=`translate(${(Math.random()*12-6).toFixed(1)}rem, ${(Math.random()*4-2).toFixed(1)}rem) scale(.8)`; return; }
      if (action==="moon") return showToast(STORY.moonJoke);
      if (action==="letter") { letterShown=true; render(); audioStart(); return; }
      if (action==="photo") { photoTaps++; if(photoTaps>=3) showToast(STORY.finalPhotoSecret); return; }
      if (targetEl.dataset.key) {
        const k=targetEl.dataset.key; if(k==="←") code=code.slice(0,-1); else if(k==="✓") { const good=code.toLowerCase()===STORY.unlockCode.toLowerCase() || code===STORY.metDate; if(good){screen="chapter";render();} else {code=""; $(".door")?.classList.add("shake"); showToast(STORY.funnyHint);} } else if(code.length<18) code+=k; render(); return;
      }
      if (targetEl.dataset.memory) { memory=STORY.memories[Number(targetEl.dataset.memory)]; render(); return; }
      if (targetEl.dataset.piece) { const n=Number(targetEl.dataset.piece); if(n===selectedPiece+1 || (selectedPiece===null && n===1)) selectedPiece=n; render(); return; }
      if (targetEl.dataset.answer) { const q=STORY.quiz[quizIndex]; if(Number(targetEl.dataset.answer)===q[2]){ hearts++; quizIndex++; render(); } else showToast(STORY.wrongQuiz); return; }
      if (targetEl.dataset.star) { const n=Number(targetEl.dataset.star); if(n===visitedStars.length){visitedStars.push(n); showToast(STORY.starMessages[n]); render();} else if(!visitedStars.includes(n)) showToast("Follow the glowing path, one star at a time."); return; }
    });
    app.addEventListener("submit", e => { if(e.target.id!=="riddleForm") return; e.preventDefault(); const answer=$("#riddleInput").value.trim().toLowerCase(); if(answer && (answer===STORY.riddleAnswer.toLowerCase() || answer.includes(STORY.riddleAnswer.toLowerCase()))) { screen="finale"; render(); confetti(); } else showToast("Close… listen to the little hint hidden in the question."); });
    render();
  </script>
</body>
</html>
